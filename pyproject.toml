[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-agent"
version = "0.1.0"
description = "Invoice-to-payment agent: extraction, validation, matching and payment decisions."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "faker",
    "reportlab",
    "pillow",
    "pymupdf",
    "httpx",
]

[project.optional-dependencies]
dev = ["pytest"]
claude = ["anthropic>=2.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
