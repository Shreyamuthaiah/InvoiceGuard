[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "invoiceguard"
version = "0.1.0"
description = "InvoiceGuard: AI invoice-to-payment automation with fraud controls (LLM extraction, deterministic checks, review agent, safe payments)."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "faker",
    "reportlab",
    "pillow",
    "pymupdf",
    "httpx",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]
claude = ["anthropic>=2.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "SIM"]
ignore = ["SIM108"]  # explicit if/else often reads better than a long ternary

[tool.ruff.lint.per-file-ignores]
# Drawing code keeps coordinate pairs on one line; the UI embeds its HTML/JS page as a string.
"src/invoiceguard/synth/render.py" = ["E702", "E501"]
"src/invoiceguard/ui.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
